<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        background: radial-gradient(
          ellipse at 50% 30%,
          #16181c 0%,
          #0b0c0d 60%,
          #000 100%
        );
        font-family: -apple-system, "Inter", "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      /* The layout below is designed on an 1800x950 canvas. The recording frame is
     1920x1080 (16:9), so the canvas is scaled to the frame width and centered
     vertically.

     The canvas's vertical budget: the header (as tall as its content), then
     the band of screens, then a fixed-height narration zone at the bottom.
     The row of screens zooms to fill the band — up or down, whichever of its
     width or height runs out first — so dropping the title or the column
     labels gives the screens that room. */
      :root {
        --narration-h: 103px;
      }
      .canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 1800px;
        height: 950px;
        transform-origin: 0 0;
        transform: translateY(33.333px) scale(1.066667);
      }
      /* Spans header to narration; its top and height are set by fitStage(). */
      .stage-band {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stage-row {
        width: max-content;
        flex: none;
        display: flex;
        align-items: flex-start;
        gap: 80px;
      }
      /* --- Header: wordmark + flow-defined title, top-center. The screens
     start below wherever it ends. --- */
      .header {
        position: absolute;
        top: 20px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      /* Optional brand wordmark, top-center above the title. Empty unless a
         flow passes ?wordmark= — most flows won't set one. */
      .wordmark {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 18px;
        letter-spacing: 0.32em;
        color: #f2f1ee;
      }
      .wordmark:empty {
        display: none;
      }
      /* An intro or outro (?intro, ?outro): a page played fullscreen over
         everything, in its own frame. The intro fades out as the clips start;
         the outro fades in once they are over. */
      .page {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #000;
        transition: opacity var(--page-fade) ease;
      }
      .page.hidden {
        opacity: 0;
      }
      .page iframe {
        display: block;
        width: 1920px;
        height: 1080px;
        border: 0;
      }
      /* The project's brand.html (.appreel/brand/), in place of the wordmark.
         Unstyled here on purpose: its own style.css decides the look. */
      .brand:empty {
        display: none;
      }
      .title {
        color: rgba(255, 255, 255, 0.85);
        font-size: 34px;
        font-weight: 600;
      }
      .title:empty {
        display: none;
      }
      /* --- Narration: a small header (Step 3, See it in action) over one line of
     what is happening, sized to exactly those two rows and pinned near the
     bottom of the frame, so the band above sits as close to it as it does to
     the title. One line only: record.mjs refuses longer narration
     (NARRATION_MAX_CHARS), and nowrap keeps it out of the band regardless. --- */
      .narration {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--narration-h);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        padding: 0 120px 8px;
      }
      /* Fixed heights, so a line without a header sits where one with a header
         does, and the text never jumps between the two. */
      .narration-header-box,
      .narration-lines {
        display: grid;
        place-items: center;
      }
      .narration-header-box {
        height: 30px;
      }
      .narration-lines {
        min-height: 53px;
      }
      .narration-item {
        grid-area: 1 / 1;
        text-align: center;
        line-height: 1.25;
        opacity: 0;
        transform: translateY(var(--travel));
        /* --narration-in/-out are set from ?narrationIn/?narrationOut, which
           compose.mjs takes from narration.mjs. The old item clears out fast
           (ease-out) while the new one arrives gently (ease-in-out), so the two
           are not both legible in the same spot. */
        transition:
          opacity var(--narration-in) ease-in-out,
          transform var(--narration-in) ease-in-out;
      }
      .narration-item.in {
        opacity: 1;
        transform: translateY(0);
      }
      .narration-item.out {
        opacity: 0;
        transform: translateY(calc(var(--travel) * -1));
        transition:
          opacity var(--narration-out) ease-out,
          transform var(--narration-out) ease-out;
      }
      .narration-line {
        --travel: 28px;
        /* Soft yellow and a size above the title's, so it reads as its own
           thing next to the white header. */
        color: #f4d35e;
        font-size: 42px;
        font-weight: 600;
        white-space: nowrap;
      }
      /* Supporting context rather than a step to follow: white, and a lighter
         weight, so it sits back from the yellow steps. */
      .narration-line.aside {
        color: rgba(255, 255, 255, 0.82);
        font-weight: 500;
      }
      .narration-header {
        --travel: 14px;
        display: flex;
        justify-content: center;
        color: rgba(244, 211, 94, 0.7);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      /* A header that ends in a number ("Step 3") is a still prefix and a
         number that swaps on its own, so only the number moves between steps. */
      .narration-prefix {
        white-space: pre;
      }
      .narration-suffixes {
        display: grid;
      }
      .narration-header.aside {
        color: rgba(255, 255, 255, 0.55);
      }
      /* --- Focus: the screen the current line is about. Deliberately quiet: its
     label goes white with the faintest yellow glow, and its frame gets a thin
     yellow rim and a very soft halo. --- */
      .label {
        transition:
          color 500ms ease,
          text-shadow 500ms ease;
      }
      [class^="frame-"] {
        transition: box-shadow 500ms ease;
      }
      .column.active .label {
        color: rgba(255, 255, 255, 0.95);
        text-shadow: 0 0 12px rgba(244, 211, 94, 0.35);
      }
      .column.active .frame-desktop,
      .column.active .frame-mobile,
      .column.active .frame-mac,
      .column.active .frame-windows,
      .column.active .frame-chrome {
        box-shadow:
          0 0 0 1px rgba(244, 211, 94, 0.4),
          0 0 26px 0 rgba(244, 211, 94, 0.12),
          0 40px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .column.active .frame-none .screen {
        box-shadow:
          0 0 0 1px rgba(244, 211, 94, 0.4),
          0 0 26px 0 rgba(244, 211, 94, 0.12);
      }
      .column {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* Divided by the row's zoom so a label stays the same size however far
         the screens under it are zoomed. */
      .label {
        color: rgba(255, 255, 255, 0.55);
        font-size: calc(22px / var(--stage-zoom, 1));
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: calc(28px / var(--stage-zoom, 1));
      }
      .label:empty {
        display: none;
        margin-bottom: 0;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Clips are 16:9; a taller chrome viewport (vertical fill) is not. Cover
         would crop the left and right at full zoom — contain keeps the full
         browser width visible (letterboxing inside the screen if needed). */
      .frame-chrome .screen video,
      .frame-none .screen video {
        object-fit: contain;
      }

      /* --- desktop: a monitor mockup (bezel + chin + stand) --- */
      .frame-desktop {
        width: 840px;
        padding: 20px 20px 0 20px;
        background: linear-gradient(180deg, #2a2b2f 0%, #17181b 100%);
        border-radius: 18px;
        box-shadow:
          0 40px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .frame-desktop .screen {
        width: 800px;
        height: 450px;
        border-radius: 4px;
        overflow: hidden;
        background: #000;
      }
      .frame-desktop .chin {
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .frame-desktop .chin::after {
        content: "";
        width: 64px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
      }
      .stand-neck {
        width: 26px;
        height: 34px;
        background: linear-gradient(180deg, #222327 0%, #17181b 100%);
        margin: 0 auto;
      }
      .stand-foot {
        width: 260px;
        height: 14px;
        border-radius: 7px;
        background: linear-gradient(180deg, #222327 0%, #17181b 100%);
        margin: 0 auto;
        box-shadow: 0 18px 30px rgba(0, 0, 0, 0.5);
      }

      /* --- mobile: a phone mockup --- */
      .frame-mobile {
        width: 343px;
        padding: 16px;
        background: linear-gradient(160deg, #2c2d31 0%, #16171a 100%);
        border-radius: 16px;
        box-shadow:
          0 40px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        position: relative;
      }
      /* Deliberately much smaller than the outer case radius above — a real
     iPhone's display corner radius is subtle; matching the case radius here
     clipped visible app content (nav icons, corner text) at the edges. */
      .frame-mobile .screen {
        width: 311px;
        height: 526px;
        border-radius: 14px;
        overflow: hidden;
        background: #000;
        position: relative;
      }
      .frame-mobile .side-button {
        position: absolute;
        width: 4px;
        background: #0f1013;
        border-radius: 2px;
      }
      .frame-mobile .side-button.mute {
        right: -4px;
        top: 102px;
        height: 30px;
      }
      .frame-mobile .side-button.vol-up {
        left: -4px;
        top: 139px;
        height: 44px;
      }
      .frame-mobile .side-button.vol-down {
        left: -4px;
        top: 196px;
        height: 44px;
      }
      .frame-mobile .side-button.power {
        right: -4px;
        top: 159px;
        height: 60px;
      }

      /* --- mac / windows: app window chrome (titlebar above, no bezel/stand) --- */
      .frame-mac,
      .frame-windows {
        width: 840px;
        border-radius: 10px;
        overflow: hidden;
        background: #1c1d20;
        box-shadow:
          0 40px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .frame-mac .titlebar,
      .frame-windows .titlebar {
        height: 36px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        background: linear-gradient(180deg, #3a3b3f 0%, #2a2b2f 100%);
      }
      /* A real macOS title bar is ~28pt around 12pt traffic lights; the shared
         36px read as too tall next to them. */
      .frame-mac .titlebar {
        height: 28px;
        gap: 8px;
        padding: 0 10px;
      }
      .frame-mac .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .frame-mac .dot.red {
        background: #ff5f57;
      }
      .frame-mac .dot.yellow {
        background: #febc2e;
      }
      .frame-mac .dot.green {
        background: #28c840;
      }
      .frame-windows .titlebar .label-text {
        color: rgba(255, 255, 255, 0.55);
        font-size: 13px;
      }
      .frame-windows .controls {
        margin-left: auto;
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .frame-windows .control {
        width: 12px;
        height: 12px;
        position: relative;
      }
      .frame-windows .control.minimize::after {
        content: "";
        position: absolute;
        bottom: 1px;
        left: 0;
        width: 100%;
        height: 1.5px;
        background: rgba(255, 255, 255, 0.6);
      }
      .frame-windows .control.maximize {
        border: 1.5px solid rgba(255, 255, 255, 0.6);
      }
      .frame-windows .control.close::before,
      .frame-windows .control.close::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 1.5px;
        background: rgba(255, 255, 255, 0.6);
      }
      .frame-windows .control.close::before {
        transform: rotate(45deg);
      }
      .frame-windows .control.close::after {
        transform: rotate(-45deg);
      }
      .frame-mac .screen,
      .frame-windows .screen {
        width: 840px;
        height: 472px;
        background: #000;
        overflow: hidden;
      }

      /* --- chrome: a browser window (tab strip + address bar) --- */
      .frame-chrome {
        width: 840px;
        border-radius: 10px;
        overflow: hidden;
        background: #1c1d20;
        box-shadow:
          0 40px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .frame-chrome .tabbar {
        height: 32px;
        display: flex;
        align-items: flex-end;
        gap: 6px;
        padding: 6px 10px 0;
        background: #2a2b2f;
      }
      .frame-chrome .tab {
        background: #3a3b3f;
        border-radius: 8px 8px 0 0;
        padding: 6px 18px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.8);
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .frame-chrome .addressbar {
        height: 30px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        background: #1c1d20;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .frame-chrome .lock {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #7c8591;
        flex: none;
      }
      .frame-chrome .url {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.45);
      }
      /* 16:9 like the recordings, so none of the page is cropped (a shorter
         screen cut off the top of it: the site's header, the part that tells
         the viewer which site this is). */
      .frame-chrome .screen {
        width: 840px;
        height: 472px;
        background: #000;
        overflow: hidden;
      }

      /* --- none: fullscreen, no wrapper at all --- */
      .frame-none {
        width: 840px;
      }
      .frame-none .screen {
        width: 840px;
        height: 472px;
        overflow: hidden;
        background: #000;
        border-radius: 6px;
      }

      /* --- custom: intentionally unstyled. The consuming project supplies its
     own template.html + style.css (see compose.mjs --help); this package
     ships no default look for it. --- */
      .frame-custom {
      }
    </style>
  </head>
  <body>
    <h1
      style="
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      "
    >
      Presentation stage
    </h1>
    <div class="canvas">
      <div class="header">
        <div class="brand" id="brand"></div>
        <div class="wordmark" id="wordmark"></div>
        <div class="title" id="title"></div>
      </div>
      <div class="stage-band" id="stage-band">
        <div class="stage-row" id="stage-row"></div>
      </div>
      <div class="narration">
        <div class="narration-header-box" id="narration-header-box"></div>
        <div class="narration-lines" id="narration-lines"></div>
      </div>
    </div>
    <script>
      // Driven by query params (page-wide scalars) plus /screens.json (the
      // per-screen array — too structured for a query string), so this page
      // is reusable across recordings rather than one-off per set of clips:
      //   ?header=<text>       (this recording's title, shown top-center)
      //   &wordmark=<text>     (optional; blank by default, no brand mark shown)
      //   &brand=html|html+css (optional; load /brand/brand.html [+ style.css])
      //   &intro=<url>&introMs=<ms> (optional; a page played before the stage)
      //   &outro=<url>&outroMs=<ms>&outroAt=<ms> (optional; a page played after
      //                        the clips, from outroAt on their clock)
      //   &outro=<url>&outroMs=<ms>&outroAt=<ms> (optional; a page played after
      //                        it, from outroAt on the clips' clock)
      //   &narration=<url>     (optional; scheduled lines: {start, text, style, header, focus})
      // /screens.json: [{ name, label, frame, enterAtMs, clip, template?, style? }, ...]
      // frame is one of: desktop | mobile | mac | windows | chrome | custom | none.
      const params = new URLSearchParams(location.search);

      document.getElementById("wordmark").textContent = params.get("wordmark") ?? "";

      // Headers always render in title case, whatever the flow passes. Small
      // words stay lowercase mid-title; other words only get their first
      // letter raised, so acronyms like "CAM" are left alone.
      const SMALL_WORDS = new Set([
        "a",
        "an",
        "and",
        "as",
        "at",
        "but",
        "by",
        "for",
        "in",
        "nor",
        "of",
        "on",
        "or",
        "the",
        "to",
        "up",
        "via",
      ]);
      const titleCase = (text) => {
        const words = text.split(" ");
        return words
          .map((word, i) => {
            const isEdge = i === 0 || i === words.length - 1;
            if (!isEdge && SMALL_WORDS.has(word.toLowerCase())) {
              return word.toLowerCase();
            }
            return word.charAt(0).toUpperCase() + word.slice(1);
          })
          .join(" ");
      };

      // No ?header means the page was opened for design work, so show a sample
      // title. Recordings always pass ?header (empty when a flow has none).
      document.getElementById("title").textContent = titleCase(
        params.get("header") ?? "Your Flow's Title Goes Here",
      );

      // Preview only (?fit): the stage is a fixed 1920x1080 frame, so scale it
      // down to fit a smaller browser window instead of clipping the right side.
      // Recording never sets this, so output stays exactly 1920x1080.
      if (params.has("fit")) {
        const fitToWindow = () => {
          document.documentElement.style.zoom = Math.min(
            innerWidth / 1920,
            innerHeight / 1080,
          );
        };
        fitToWindow();
        addEventListener("resize", fitToWindow);
      }

      // Natural (unscaled) width per frame type, used to compute how much to
      // zoom the whole row so any number of screens fits the 1800px canvas —
      // this replaces the old hand-tuned budget that only had to work for
      // exactly one fixed pair of devices.
      const NATURAL_WIDTH = {
        desktop: 840,
        mac: 840,
        windows: 840,
        chrome: 840,
        none: 840,
        custom: 840,
        mobile: 343,
      };

      function buildFrame(screen) {
        const video = document.createElement("video");
        video.muted = true;
        video.playsInline = true;
        video.dataset.screen = screen.name;
        if (screen.clip) video.src = screen.clip;

        const column = document.createElement("div");
        column.className = "column";
        column.dataset.screen = screen.name;

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = screen.label ?? "";
        column.appendChild(label);

        const screenDiv = () => {
          const div = document.createElement("div");
          div.className = "screen";
          div.appendChild(video);
          return div;
        };

        let ready = Promise.resolve();

        if (screen.frame === "mobile") {
          const phone = document.createElement("div");
          phone.className = "frame-mobile";
          ["mute", "vol-up", "vol-down", "power"].forEach((kind) => {
            const btn = document.createElement("div");
            btn.className = `side-button ${kind}`;
            phone.appendChild(btn);
          });
          phone.appendChild(screenDiv());
          column.appendChild(phone);
        } else if (screen.frame === "desktop") {
          const monitor = document.createElement("div");
          monitor.className = "frame-desktop";
          monitor.appendChild(screenDiv());
          const chin = document.createElement("div");
          chin.className = "chin";
          monitor.appendChild(chin);
          column.appendChild(monitor);
          const neck = document.createElement("div");
          neck.className = "stand-neck";
          column.appendChild(neck);
          const foot = document.createElement("div");
          foot.className = "stand-foot";
          column.appendChild(foot);
        } else if (screen.frame === "mac" || screen.frame === "windows") {
          const win = document.createElement("div");
          win.className = `frame-${screen.frame}`;
          const titlebar = document.createElement("div");
          titlebar.className = "titlebar";
          if (screen.frame === "mac") {
            ["red", "yellow", "green"].forEach((color) => {
              const dot = document.createElement("div");
              dot.className = `dot ${color}`;
              titlebar.appendChild(dot);
            });
          } else {
            const labelText = document.createElement("div");
            labelText.className = "label-text";
            labelText.textContent = screen.label ?? "";
            titlebar.appendChild(labelText);
            const controls = document.createElement("div");
            controls.className = "controls";
            ["minimize", "maximize", "close"].forEach((kind) => {
              const control = document.createElement("div");
              control.className = `control ${kind}`;
              controls.appendChild(control);
            });
            titlebar.appendChild(controls);
          }
          win.appendChild(titlebar);
          win.appendChild(screenDiv());
          column.appendChild(win);
        } else if (screen.frame === "chrome") {
          const win = document.createElement("div");
          win.className = "frame-chrome";
          const tabbar = document.createElement("div");
          tabbar.className = "tabbar";
          const tab = document.createElement("div");
          tab.className = "tab";
          tab.textContent =
            screen.label || screen.url?.split("/")[0] || "New Tab";
          tabbar.appendChild(tab);
          win.appendChild(tabbar);
          const addressbar = document.createElement("div");
          addressbar.className = "addressbar";
          const lock = document.createElement("div");
          lock.className = "lock";
          addressbar.appendChild(lock);
          const url = document.createElement("div");
          url.className = "url";
          url.textContent = screen.url || screen.label || "";
          addressbar.appendChild(url);
          win.appendChild(addressbar);
          win.appendChild(screenDiv());
          column.appendChild(win);
        } else if (screen.frame === "custom") {
          const wrap = document.createElement("div");
          wrap.className = "frame-custom";
          column.appendChild(wrap);
          ready = (async () => {
            if (screen.style) {
              const link = document.createElement("link");
              link.rel = "stylesheet";
              link.href = screen.style;
              document.head.appendChild(link);
            }
            if (screen.template) {
              wrap.innerHTML = await (await fetch(screen.template)).text();
              const slot = wrap.querySelector("[data-video-slot]");
              (slot ?? wrap).appendChild(video);
            } else {
              wrap.appendChild(video);
            }
          })();
        } else {
          // "none"
          const wrap = document.createElement("div");
          wrap.className = "frame-none";
          wrap.appendChild(screenDiv());
          column.appendChild(wrap);
        }

        return {
          column,
          video,
          ready,
          frame: screen.frame,
          enterAtMs: screen.enterAtMs ?? 0,
          exitAtMs: screen.exitAtMs ?? Infinity,
        };
      }

      const isOnStageAt = (b, ms) => b.enterAtMs <= ms && ms < b.exitAtMs;
      const widthOf = (b) => NATURAL_WIDTH[b.frame] ?? 840;
      const rowWidth = (items) =>
        items.reduce((sum, b) => sum + widthOf(b), 0) + Math.max(0, items.length - 1) * ROW_GAP;
      // The widest the row ever gets: checked at every moment a screen enters
      // or leaves, so screens never on stage together don't shrink each other.
      const widestRow = (built) => {
        const moments = [0, ...built.flatMap((b) => [b.enterAtMs, b.exitAtMs])].filter(Number.isFinite);
        return Math.max(...moments.map((ms) => rowWidth(built.filter((b) => isOnStageAt(b, ms)))));
      };

      const ROW_GAP = 80;
      const ENTER_MS = 700;
      const CANVAS_W = 1800;
      // Clear space between the band of screens and the header above it or
      // the narration zone below it (which has its own clear space too).
      const BAND_GAP = 20;

      // Sizes the band to the room between the header and the narration zone,
      // then zooms the row to fill it: as wide as the most screens ever on
      // stage at once allow, as tall as the tallest column allows. Labels are
      // held at their natural size (see .label), so only the rest of a column
      // counts toward the zoom. Runs once the header's brand and fonts are in,
      // since their height decides where the band starts.
      function fitStage(built) {
        const header = document.querySelector(".header");
        const narration = document.querySelector(".narration");
        const band = document.getElementById("stage-band");
        const row = document.getElementById("stage-row");
        const top = header.offsetTop + header.offsetHeight + BAND_GAP;
        const bandH = narration.offsetTop - BAND_GAP - top;
        band.style.top = `${top}px`;
        band.style.height = `${bandH}px`;

        const labelH = Math.max(
          0,
          ...built.map(({ column }) => {
            const label = column.querySelector(":scope > .label");
            if (!label.textContent.trim()) return 0;
            return label.offsetHeight + parseFloat(getComputedStyle(label).marginBottom);
          }),
        );
        const zoom = Math.min(
          CANVAS_W / widestRow(built),
          (bandH - labelH) / (row.offsetHeight - labelH),
        );
        row.style.setProperty("--stage-zoom", zoom);
        row.style.zoom = zoom;
      }

      // Screens with an enterAtMs/exitAtMs are on stage for only part of the
      // video. Every screen stays laid out in the row the whole time, so
      // nothing reflows; one that is off stage is hidden, and the ones on
      // stage are shifted to sit centered without it. Transforms only, in the
      // row's own unzoomed units, so no glow is clipped.
      function placeColumns(built, ms, { animate }) {
        const leftEdges = (items) => {
          let x = -rowWidth(items) / 2;
          return new Map(
            items.map((b) => {
              const left = x;
              x += widthOf(b) + ROW_GAP;
              return [b, left];
            }),
          );
        };
        const finalLeft = leftEdges(built);
        const stageLeft = leftEdges(built.filter((b) => isOnStageAt(b, ms)));
        // Staggered so a screen never shows over one still moving: an
        // entering screen fades in once the others have mostly made room, and
        // the others close up once a leaving screen has mostly faded.
        const isAnyLeaving = built.some((b) => b.isOnStage && !stageLeft.has(b));
        const ease = "cubic-bezier(0.22, 1, 0.36, 1)";
        const fadeMs = ENTER_MS * 0.6;
        const staggerMs = ENTER_MS * 0.4;
        for (const b of built) {
          const isOnStage = stageLeft.has(b);
          const isEntering = isOnStage && b.isOnStage === false;
          const isLeaving = !isOnStage && b.isOnStage === true;
          const moveDelay = isAnyLeaving && !isLeaving ? staggerMs : 0;
          const fadeDelay = isEntering ? staggerMs : 0;
          // An off-stage screen sits a short distance to its right, so it
          // fades in from there and fades out toward there.
          const shift = isOnStage ? stageLeft.get(b) - finalLeft.get(b) : 24;
          b.column.style.transition = animate
            ? `transform ${ENTER_MS}ms ${ease} ${moveDelay}ms, opacity ${fadeMs}ms ease ${fadeDelay}ms`
            : "none";
          b.column.style.transform = `translateX(${shift}px)`;
          b.column.style.opacity = isOnStage ? "1" : "0";
          b.isOnStage = isOnStage;
        }
      }

      async function buildStage() {
        const screens = await (await fetch("/screens.json")).json();
        const stageRow = document.getElementById("stage-row");
        const built = screens.map(buildFrame);
        built.forEach(({ column }) => stageRow.appendChild(column));
        await Promise.all(built.map(({ ready }) => ready));
        placeColumns(built, 0, { animate: false });
        return built;
      }

      // The project's brand: brand.html in the header's brand slot, replacing
      // the wordmark, plus its style.css. Its relative src/href point into
      // /brand/, where the folder is served. Everything (styles, fonts,
      // images) is loaded before playback starts, so no frame shows it
      // half-drawn.
      async function loadBrand() {
        const brand = params.get("brand");
        if (!brand) return;
        const loads = [];
        if (brand === "html+css") {
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = "/brand/style.css";
          loads.push(new Promise((resolve) => (link.onload = link.onerror = resolve)));
          document.head.appendChild(link);
        }
        const slot = document.getElementById("brand");
        slot.innerHTML = await (await fetch("/brand/brand.html")).text();
        for (const el of slot.querySelectorAll("[src], [href]")) {
          for (const attr of ["src", "href"]) {
            const value = el.getAttribute(attr);
            if (value && !/^([a-z]+:|\/|#)/i.test(value)) {
              el.setAttribute(attr, `/brand/${value}`);
            }
          }
        }
        document.getElementById("wordmark").textContent = "";
        loads.push(...[...slot.querySelectorAll("img")].map((img) => img.decode().catch(() => {})));
        await Promise.all(loads);
        await document.fonts.ready;
      }

      const PAGE_FADE_MS = 600;
      document.documentElement.style.setProperty("--page-fade", `${PAGE_FADE_MS}ms`);
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      // Opens the intro or outro page ("intro" | "outro") over the stage and
      // resolves once it has loaded. It is told how long it plays
      // (?appreelIntroMs / ?appreelOutroMs), so it can time its own
      // animation, and the video's header, so a shared page can show each
      // video's title.
      async function openPage(kind, { hidden }) {
        const src = params.get(kind);
        const overlay = document.createElement("div");
        overlay.className = hidden ? "page hidden" : "page";
        const frame = document.createElement("iframe");
        const msParam = kind === "intro" ? "appreelIntroMs" : "appreelOutroMs";
        const pageParams = new URLSearchParams({
          [msParam]: params.get(`${kind}Ms`),
          appreelHeader: params.get("header") ?? "",
        });
        frame.src = `${src}${src.includes("?") ? "&" : "?"}${pageParams}`;
        overlay.appendChild(frame);
        document.body.appendChild(overlay);
        await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
        return overlay;
      }

      // The intro covers the stage from the first frame; the stage is built
      // behind it, and the clips start as it fades out.
      async function playIntro() {
        if (!params.get("intro")) return;
        const overlay = await openPage("intro", { hidden: false });
        await sleep(Number(params.get("introMs")));
        overlay.classList.add("hidden");
        setTimeout(() => overlay.remove(), PAGE_FADE_MS + 50);
      }

      // The outro fades in over the stage once the clips (started as this is
      // called) are over, and holds until the recording ends.
      async function playOutro() {
        if (!params.get("outro")) return;
        await sleep(Number(params.get("outroAt")));
        const overlay = await openPage("outro", { hidden: true });
        overlay.getBoundingClientRect(); // commit the start state so it transitions
        overlay.classList.remove("hidden");
      }

      async function playAll(videos) {
        const ready = (v) =>
          v.readyState >= 3
            ? Promise.resolve()
            : new Promise((r) => v.addEventListener("canplay", r, { once: true }));
        await Promise.all(videos.map(ready));
        videos.forEach((v) => {
          v.currentTime = 0;
        });
        await Promise.all(videos.map((v) => v.play()));
      }

      // Narration: the header and line under the screens are whichever entry
      // started most recently, judged by the first screen's own playback time
      // so they stay in step with the video however the recorder paces this
      // page. The list is already scheduled (compose.mjs), so every line has
      // had its time to read. Each entry also says which screen(s) it is about.
      const narrationOutMs = Number(params.get("narrationOut"));
      document.documentElement.style.setProperty(
        "--narration-in",
        `${Number(params.get("narrationIn"))}ms`,
      );
      document.documentElement.style.setProperty(
        "--narration-out",
        `${narrationOutMs}ms`,
      );
      // One swapper per row. It animates only when its text or tone changes, so
      // a header shared by several lines stays put while the lines change.
      const makeSwapper = (box, kind) => {
        let current = null;
        let shown = "";
        return (text, style) => {
          const key = `${style ?? "step"}|${text}`;
          if (key === shown) return;
          shown = key;
          const old = current;
          current = null;
          if (old) {
            // Keep the tone class: an outgoing white line must not flip to yellow.
            old.classList.remove("in");
            old.classList.add("out");
            setTimeout(() => old.remove(), narrationOutMs + 50);
          }
          if (!text) return;
          const el = document.createElement("div");
          const tone = style === "aside" ? " aside" : "";
          el.className = `narration-item ${kind}${tone}`;
          el.textContent = text;
          box.appendChild(el);
          el.getBoundingClientRect(); // commit the start state so it transitions
          el.className = `narration-item ${kind}${tone} in`;
          current = el;
        };
      };
      // The header row. A header ending in a number is split into a still prefix
      // ("Step ") and the number; when only the number differs, only the number
      // animates, so "1" rises out as "2" rises in under a "Step" that stays put.
      // Anything else swaps whole, like a line.
      const headerBox = document.getElementById("narration-header-box");
      const splitHeader = (text) => {
        const match = /^(.*\s)(\d+)$/.exec(text);
        return match ? { prefix: match[1], number: match[2] } : { prefix: null };
      };
      const leave = (el) => {
        el.classList.remove("in");
        el.classList.add("out");
        setTimeout(() => el.remove(), narrationOutMs + 50);
      };
      let header = null; // { el, prefix, tone, suffixes, number }
      let shownHeader = "";
      const showHeader = (text, style) => {
        const key = `${style ?? "step"}|${text}`;
        if (key === shownHeader) return;
        shownHeader = key;
        const tone = style === "aside" ? " aside" : "";
        const parts = splitHeader(text);
        if (header && parts.prefix !== null && parts.prefix === header.prefix && tone === header.tone) {
          leave(header.number);
          const number = document.createElement("div");
          number.className = "narration-item";
          number.textContent = parts.number;
          header.suffixes.appendChild(number);
          number.getBoundingClientRect(); // commit the start state so it transitions
          number.className = "narration-item in";
          header.number = number;
          return;
        }
        if (header) leave(header.el);
        header = null;
        if (!text) return;
        const el = document.createElement("div");
        el.className = `narration-item narration-header${tone}`;
        let suffixes = null;
        let number = null;
        if (parts.prefix !== null) {
          const prefix = document.createElement("span");
          prefix.className = "narration-prefix";
          prefix.textContent = parts.prefix;
          suffixes = document.createElement("span");
          suffixes.className = "narration-suffixes";
          number = document.createElement("div");
          number.className = "narration-item in";
          number.textContent = parts.number;
          suffixes.appendChild(number);
          el.append(prefix, suffixes);
        } else {
          el.textContent = text;
        }
        headerBox.appendChild(el);
        el.getBoundingClientRect(); // commit the start state so it transitions
        el.className = `narration-item narration-header${tone} in`;
        header = { el, prefix: parts.prefix, tone, suffixes, number };
      };
      const showLine = makeSwapper(
        document.getElementById("narration-lines"),
        "narration-line",
      );

      async function main() {
        const introDone = playIntro();
        const [built] = await Promise.all([buildStage(), loadBrand()]);
        await document.fonts.ready;
        fitStage(built);
        await introDone;
        const videos = built.map(({ video }) => video);
        await playAll(videos);
        playOutro();
        const clockVideo = videos[0];

        // Moves screens on and off stage as the clips reach their
        // enterAtMs/exitAtMs, until the last of those has passed.
        const lastChangeMs = Math.max(
          0,
          ...built.flatMap((b) => [b.enterAtMs, b.exitAtMs]).filter(Number.isFinite),
        );
        const onStageKey = (ms) => built.map((b) => (isOnStageAt(b, ms) ? 1 : 0)).join("");
        let shownKey = onStageKey(0);
        const watchStage = () => {
          const ms = clockVideo.currentTime * 1000;
          const key = onStageKey(ms);
          if (key !== shownKey) {
            shownKey = key;
            placeColumns(built, ms, { animate: true });
          }
          if (ms <= lastChangeMs) requestAnimationFrame(watchStage);
        };
        watchStage();

        const columnsByName = new Map(
          built.map(({ column }) => [column.dataset.screen, column]),
        );
        const showFocus = (focus) => {
          const all = focus === "all";
          for (const [name, column] of columnsByName) {
            column.classList.toggle("active", all || focus === name);
          }
        };

        async function runNarration() {
          const src = params.get("narration");
          if (!src) {
            // Opened for design work (?fit), so show a sample. Recordings
            // never pass ?fit.
            if (params.has("fit") && built.length) {
              showHeader("Step 1");
              showLine("Click the highlighted element");
              showFocus(built[0].column.dataset.screen);
            }
            return;
          }
          const lines = await (await fetch(src)).json();
          const tick = () => {
            const ms = clockVideo.currentTime * 1000;
            let current = { text: "" };
            for (const line of lines) {
              if (line.start > ms) break;
              current = line;
            }
            showHeader(current.header ?? "", current.style);
            showLine(current.text, current.style);
            showFocus(current.focus);
            requestAnimationFrame(tick);
          };
          tick();
        }
        runNarration();
      }
      main();
    </script>
  </body>
</html>
